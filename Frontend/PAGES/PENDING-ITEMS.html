<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendientes | SGP</title>
    <link rel="icon" type="image/png" href="../MEDIA/IMAGES/SGP_LOGO.png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/d90850e71e.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/dashboard.css">
    <link rel="stylesheet" href="../CSS/pending-items.css">
</head>
<body>

    <!-- SIDEBAR  -->
    <aside class="sidebar">
        <div class="brand-section">
            <div class="logo-box">
                <img src="../MEDIA/IMAGES/SGP_LOGO.png" alt="Logo SGP"> 
            </div>
            <div>
                <h2>Ius Semper</h2>
                <span>PERICIAL</span>
            </div>
        </div>

        <div class="online-user">
            <div class="status-dot"></div>
            <div>
                <p class="mb-0 fw-semibold">Usuario en línea</p>
                <small id="user-name"></small>
            </div>
        </div>

        <nav class="menu-options">
            <a href="../PAGES/DASHBOARD.html" class="menu-card">
                <i class="fas fa-chart-line"></i>
                <span>Panel Principal</span>
            </a>
            <a href="../PAGES/PENDING-ITEMS.html" class="menu-card active">
                <i class="fas fa-list-check"></i>
                <span>Pendientes</span>
            </a>
            <a href="../PAGES/CALENDAR.html" class="menu-card">
                <i class="fas fa-calendar-days"></i>
                <span>Calendario</span>
            </a>
            <a href="../PAGES/FILES.html" class="menu-card">
                <i class="fas fa-folder-open"></i>
                <span>Expedientes</span>
            </a>
            <a href="../PAGES/CONTACTS.html" class="menu-card">
                <i class="fas fa-address-book"></i>
                <span>Contactos</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="footer-btn logout" onclick="logout()">
                <i class="fa-solid fa-door-open"></i>
                <span>Cerrar Sesión</span>
            </button>
        </div>
    </aside>

    <!-- PRINCIPAL CONTENT -->
    <main class="main-content">
        <div class="pending-container">
            <!-- TOPBAR -->
            <div class="topbar">
                <div>
                    <h1>Pendientes</h1>
                    <p>Organización diaria de actividades y diligencias</p>
                </div>
                <div class="datetime-box">
                    <i class="fas fa-clock"></i>
                    <span id="datetime"></span>
                </div>
            </div>
            <!-- CONTAINER -->
            <div id="agendaContainer"></div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/pending-itemsJS.js"></script>
    <script src="../JS/time&dateJS.js"></script>
</body>
</html>
