<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario | SGP</title>
    <link rel="icon" type="image/png" href="../MEDIA/IMAGES/SGP_LOGO.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/d90850e71e.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/calendar.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand-section">
            <div class="logo-box">
                <img src="../MEDIA/IMAGES/SGP_LOGO.png" alt="Logo SGP"> 
            </div>
            <div>
                <h2>Ius Semper</h2>
                <span>PERICIAL</span>
            </div>
        </div>

        <div class="online-user">
            <div class="status-dot"></div>
            <div>
                <p class="mb-0 fw-semibold">Usuario en línea</p>
                <small id="user-name"></small>
            </div>
        </div>

        <nav class="menu-options">
            <a href="../PAGES/DASHBOARD.html" class="menu-card">
                <i class="fas fa-chart-line"></i>
                <span>Panel Principal</span>
            </a>
            <a href="../PAGES/PENDING-ITEMS.html" class="menu-card">
                <i class="fas fa-list-check"></i>
                <span>Pendientes</span>
            </a>
            <a href="../PAGES/CALENDAR.html" class="menu-card active">
                <i class="fas fa-calendar-days"></i>
                <span>Calendario</span>
            </a>
            <a href="../PAGES/FILES.html" class="menu-card">
                <i class="fas fa-folder-open"></i>
                <span>Expedientes</span>
            </a>
            <a href="../PAGES/CONTACTS.html" class="menu-card">
                <i class="fas fa-address-book"></i>
                <span>Contactos</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="footer-btn logout">
                <i class="fa-solid fa-door-open"></i>
                <span>Cerrar Sesión</span>
            </button>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <!-- TOPBAR -->
        <div class="topbar">
            <div>
                <h1>Calendario</h1>
                <p>Administra tus eventos y tareas</p>
            </div>
            <div class="datetime-box">
                <i class="fas fa-clock"></i>
                <span id="datetime"></span>
            </div>
        </div>

        <div class="calendar-layout">
            <!-- CALENDARIO -->
            <section class="calendar-section">
                <div class="calendar-header">
                    <button id="prevMonth" class="nav-btn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <h2 id="monthTitle">Mayo 2026</h2>
                    <button id="nextMonth" class="nav-btn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                
                <!-- DÍAS DE LA SEMANA - AHORA FUERA DEL GRID -->
                <div class="calendar-weekdays-container">
                    <div class="calendar-weekday">Lun</div>
                    <div class="calendar-weekday">Mar</div>
                    <div class="calendar-weekday">Mié</div>
                    <div class="calendar-weekday">Jue</div>
                    <div class="calendar-weekday">Vie</div>
                    <div class="calendar-weekday">Sáb</div>
                    <div class="calendar-weekday">Dom</div>
                </div>
                
                <!-- GRID SOLO PARA LOS DÍAS -->
                <div class="calendar-grid" id="calendarGrid"></div>
            </section>

            <!-- PANEL DERECHO - DETALLES DEL DÍA -->
            <aside class="day-panel">
                <div class="selected-date">
                    <i class="fas fa-calendar-alt"></i>
                    <h3 id="selectedDateTitle">Selecciona un día</h3>
                </div>
                <div id="selectedDayPendings" class="pendings-list"></div>
            </aside>
        </div>
    </main>

    <script src="../js/time&dateJS.js"></script>
    <script src="../js/calendarJS.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
