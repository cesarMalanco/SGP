<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IUSSEMPER PERICIAL - Contactos</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/d90850e71e.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/dashboard.css">
    <link rel="stylesheet" href="../CSS/contacts.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand-section">
            <div class="logo-box">
                <i class="fas fa-scale-balanced"></i>
            </div>
            <div>
                <h2>IUS SEMPER</h2>
                <span>PERICIAL</span>
            </div>
        </div>

        <div class="online-user">
            <div class="status-dot"></div>
            <div>
                <p class="mb-0 fw-semibold">Usuario en línea</p>
                <small id="user-name">USER</small>
            </div>
        </div>

        <nav class="menu-options">
            <a href="../PAGES/DASHBOARD.html" class="menu-card">
                <i class="fas fa-chart-line"></i>
                <span>Panel Principal</span>
            </a>
            <a href="#" class="menu-card">
                <i class="fas fa-list-check"></i>
                <span>Pendientes</span>
            </a>
            <a href="#" class="menu-card">
                <i class="fas fa-calendar-days"></i>
                <span>Calendario</span>
            </a>
            <a href="FILES.html" class="menu-card">
                <i class="fas fa-folder-open"></i>
                <span>Expedientes</span>
            </a>
            <a href="#" class="menu-card active">
                <i class="fas fa-address-book"></i>
                <span>Contactos</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="footer-btn support">
                <i class="fa-regular fa-headphones"></i>
                <span>Soporte Técnico</span>
            </button>
            <button class="footer-btn logout">
                <i class="fa-solid fa-door-open"></i>
                <span>Cerrar Sesión</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOPBAR -->
        <div class="topbar">
            <div>
                <h1>Directorio de Contactos</h1>
                <p>Gestión de abogados, peritos y clientes clave</p>
            </div>
            <div class="datetime-box">
                <i class="fas fa-clock"></i>
                <span id="datetime"></span>
            </div>
        </div>

        <!-- CONTACTS HEADER -->
        <div class="contacts-header">
            <div class="contacts-summary">
                <span class="summary-badge"><i class="fas fa-users"></i> <strong id="totalContacts">0</strong> Contactos</span>
            </div>
            <button class="btn-add-contact" data-bs-toggle="modal" data-bs-target="#addContactModal">
                <i class="fas fa-plus-circle"></i> Nuevo Contacto
            </button>
        </div>

        <!-- Barra de búsqueda y filtros -->
        <div class="search-filter-bar mb-4">
            <i class="fas fa-search" style="color: var(--purple-soft);"></i>
            <input type="text" id="searchInput" placeholder="Buscar por nombre, teléfono o email...">
            <div class="filter-group">
                <i class="fas fa-filter"></i>
                <select id="categoryFilter">
                    <option value="todos">Todas las categorías</option>
                    <option value="Perito">Peritos</option>
                    <option value="Abogado">Abogados</option>
                    <option value="Cliente">Clientes</option>
                </select>
            </div>
        </div>

        <!-- GRID DE CONTACTOS -->
        <div class="row g-4" id="contactsContainer"></div>

        <!-- Mensaje sin resultados -->
        <div id="noResultsMsg" class="text-center py-5" style="display: none;">
            <i class="fas fa-address-card" style="font-size: 3rem; color: var(--purple-mist);"></i>
            <p class="mt-3 text-muted">No se encontraron contactos</p>
        </div>
    </main>

    <!-- MODAL AGREGAR CONTACTO -->
    <div class="modal fade modal-custom" id="addContactModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i> Agregar Contacto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="contactForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="contactName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol / Categoría</label>
                            <select class="form-select" id="contactCategory">
                                <option value="Perito">Perito</option>
                                <option value="Abogado">Abogado</option>
                                <option value="Cliente">Cliente</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="contactPhone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="contactEmail">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-modal-save" id="saveContactBtn">Guardar Contacto</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR CONTACTO -->
    <div class="modal fade modal-custom" id="editContactModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-edit me-2"></i> Editar Contacto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editContactId">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol / Categoría</label>
                            <select class="form-select" id="editCategory">
                                <option value="Perito">Perito</option>
                                <option value="Abogado">Abogado</option>
                                <option value="Cliente">Cliente</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="editPhone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="editEmail">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-modal-save" id="updateContactBtn">Actualizar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/time&dateJS.js"></script>
    <script src="../JS/contactsJS.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
